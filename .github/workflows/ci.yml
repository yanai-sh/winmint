name: ci

on:
  push:
    branches: [main, master, dev]
  pull_request:

# Least privilege: gate only reads the tree.
permissions:
  contents: read

# Force-push rhythm: stale runs on rewritten commits cancel themselves.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Primary host is Windows on ARM64 - gate there first.
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 11 (latest preview on channel)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "11.0.x"

      - name: Deterministic check gate
        shell: pwsh
        run: pwsh -NoProfile -File tools/host/Invoke-CheckGate.ps1

  candidate:
    needs: check
    # Candidate publishes are intentionally separate from the fast deterministic gate.
    permissions:
      contents: read
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 11 (latest preview on channel)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "11.0.x"

      - name: Publish unsigned candidate and inventory
        shell: pwsh
        run: pwsh -NoProfile -File tools/ci/Publish-WinMintCandidate.ps1

      - name: Upload candidate proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: winmint-candidate-proof
          path: |
            .scratch/candidate-proof/candidate-inventory.json
            .scratch/candidate-proof/candidate-build.log
          if-no-files-found: warn
          retention-days: 1
