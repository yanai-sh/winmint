name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# Force-push rhythm: stale runs on rewritten commits cancel themselves.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Primary host is Windows on ARM64 - gate there first.
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 11 (latest preview on channel)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"

      # Mirror of local `just check` — inlined: no just binary/action on win-arm64 runners.
      - name: Dotnet gate
        shell: pwsh
        run: |
          dotnet format --verify-no-changes
          dotnet restore
          dotnet build --no-restore
          dotnet test --no-build

      # De-risk NativeAOT win-arm64 toolchain before Smoke tickets 02–03 depend on it.
      - name: AOT publish (Provisioning Supervisor)
        shell: pwsh
        run: dotnet publish src/WinMint.Provisioning/WinMint.Provisioning.csproj -c Release -o artifacts/provisioning
