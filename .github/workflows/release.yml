name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    permissions:
      contents: read
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 11 (latest preview on channel)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "11.0.x"

      - name: Deterministic native-ARM64 check gate
        shell: pwsh
        run: pwsh -NoProfile -File tools/host/Invoke-CheckGate.ps1

  pack:
    needs: gate
    permissions:
      contents: read
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 11 (latest preview on channel)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "11.0.x"

      - name: Pack toolkit zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          pwsh -NoProfile -File tools/release/Compress-WinMintRelease.ps1 -Tag $tag -OutDir .scratch/release
          Get-ChildItem .scratch/release | Format-Table Name, Length

      - name: Stage release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winmint-release-assets
          path: |
            .scratch/release/WinMint-${{ github.ref_name }}.zip
            .scratch/release/WinMint-${{ github.ref_name }}.zip.sha256
          if-no-files-found: error

  upload:
    needs: pack
    permissions:
      contents: write
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: winmint-release-assets
          path: .scratch/release

      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            .scratch/release/WinMint-${{ github.ref_name }}.zip
            .scratch/release/WinMint-${{ github.ref_name }}.zip.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
